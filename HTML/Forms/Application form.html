<!DOCTYPE html>
<html>
<head>
    <title>Application Form</title>
</head>
<body>
<h1>Application Form</h1>   
    
    <label for="firstname">First Name:</label>
    <input type="text" id="firstname"> 
    <label for="lastname">Last Name:</label>
    <input type="text" id="lastname"> <br></br>
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob">
    <label for="age">Age:</label>
    <input type="number" id="age"><br></br>
    <label for="gender">Gender:</label>
    <select id="gender">
        <option>Male</option>
        <option>Female</option>
        <br></br>
    </select>
    <label for="email">Email Address:</label>
    <input type="email" id="email" placeholder="Enter email address"><br></br>
    <label>Positions Available:</label>
    <input type="radio" name="position"> Junior Developer
    <input type="radio" name="position"> Mid-level Developer
    <input type="radio" name="position"> Senior Developer<br></br>
    <label>Programming Languages:</label>
    <input type="checkbox"> Java
    <input type="checkbox"> JavaScript
    <input type="checkbox"> Python<br></br>

    <label for="password">Password:</label>
    <input type="Password" id="password">
    <lable for="confirm Password">Confirm Password:</label>
    <input type="Password" id="confirm Password"><br></br>
    <button type="submit">Submit</button> 
    <button type="reset">Reset</button> 
</body>
</html>
