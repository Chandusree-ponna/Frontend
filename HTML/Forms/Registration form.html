<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reg.form</title>
</head>
<body>
    <form>
    <fieldset>
        <h2 align="center">Registration Form</h2>
        <label for="first Name"> First Name:</label>
        <input type="text" id="firstname" placeholder="Enter your First name"><br></br>
        <label for="lastname"> Last Name:</label>
        <input type="text" id="lastname" placeholder="Enter your Last name"><br></br>
        <label for="Email">Enter Email Address:</label>
        <input type="email" id="Email" placeholder="Enter email address"><br></br>
        <label for="Password">Password:</label>
        <input type="password" id="Password"><br></br>
        <label for="gender">Gender:</label>
        Male<input type="radio" name="gender" value="Male">
        Female<input type="radio" name="gender" value="Female"> 
        other<input type="radio" name="gender" value="other"><br></br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="1" max="30" step="1" style="width:100px;"><br></br>
        <label for="preferences">Preferences:</label>
        Acrylic Painting<input type="checkbox">
        Oil Painting<input type="checkbox">
        Water Colour Painting<input type="checkbox"><br></br>
        <label for="occupation">Occupation:</label>
        <input type="text" id="occupation" placeholder="Student"><br></br>
        <label for="bio">Bio:</label>
        <textarea id="bio" rows="4" columns="40" placeholder="share a few lines about your self..."></textarea><br></br>  
        <div align="center">
        <button type="submit">RESET</button>
        <button type="submit">SUBMIT</button>
        </div>
        </form>
    </fieldset>
</body>
