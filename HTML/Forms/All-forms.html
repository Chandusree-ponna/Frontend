<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <label for="yourname">Text:</label>
    <input type="text" id="yourname" placeholder="Your name"><br></br>
    <label for="Password">Password:</label>
    <input type="password" id="Password" placeholder="secret"><br></br>
    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="you@example.com"><br></br>
    <label for="url">URL:</label>
    <input type="URL" id="URL" placeholder="https://www.example.com"><br></br>
    <label for="telephone">Telephone:</label>
    <input type="telephone" id="tele" placeholder="88667887788"><br></br>
    <label for="search">Search:</label>
    <input type="search" id="SEARCH" placeholder="Search term"><br></br>
    <label for="number">Number:</label>
    <input type="number" id="number" placeholder="123456789"><br></br>
    <label for="range">Range:</label>
    <input type="range" id="range" min="0" max="100" step="1"><br></br>
    <label for="date">Date:</label>
    <input type="date" id="date" value="dd-mm-yyyy">
    <label for="time">Time:</label>
    <input type="time" id="time" value="dd-mm-yyyy">
    <label for="week">Week:</label>
    <input type="week" id="week" placeholder="week: -- ,----"><br></br>
    <label for="file">File:</label>
    <input type="file" id="month" placeholder="choosen file No file choosen"><br></br>
    <label for="color">Color:</label>
    <input type="color" id="color" value="#e66465"><br></br>
    <input type="checkbox"> I agree to the terms<br></br>
    <input type="checkbox" >Subscribe to the news letter<br></br>
    <label for="Gender">Gender:</label><br></br> 
    <input type="radio" name="Gender" value="Male">male<br></br>
    <input type="radio" name="Gender" value="FeMale">Female<br></br>
    <input type="radio" name="Gender" value="Other">Other<br></br>
    <label for="country">Country (Single select):</label>
    <select>
    <option>---choose---</option>
    <option>India</option>
    <option>USA</option>
    <option>UK</option>
    </select><br></br>
    <label for="message">Message:</label>
    <textarea id="message" rows="4" columns="20" placeholder="Write Something......."></textarea><br></br>
    <button type="submit">Submit Form</button>    
    <button type="reset">Reset Form</button>

</body>
</html>
