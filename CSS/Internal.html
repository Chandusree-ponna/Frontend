<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            display: flex;
            background: black;
            align-items: center;
            justify-content: space-around;
            padding: 10px;
        }

        .logo h1 {
            color: yellow;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        button {
            background: yellow;
            padding: 8px;
            border-radius: 5px;
        }
    </style>

</head>

<body>

<header>

    <div class="logo">
        <h1>Soft School</h1>
    </div>

    <nav>
        <a href="#">Home</a>
        <a href="#">Courses</a>
        <a href="#">Reviews</a>
        <a href="#">Login</a>
        <a href="#">Signup</a>
    </nav>

    <div>
        <button>WhatsApp / Call</button>
    </div>

</header>

</body>
</html>
